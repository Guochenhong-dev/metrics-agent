services:
  mysql:
    image: mysql:8.0.43
    ports: ["127.0.0.1:3308:3306"]
    environment:
      MYSQL_DATABASE: metrics_agent
      MYSQL_USER: metrics
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-metrics-pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-pass}
    volumes: ["metrics-mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 12
  redis:
    image: redis:7.4.2-alpine
    ports: ["127.0.0.1:6381:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["metrics-redis:/data"]
volumes:
  metrics-mysql:
  metrics-redis:
